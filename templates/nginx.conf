# Phoenix: a pyramid web frontend for WPS
upstream phoenix {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

# Include request and upstream timing to diagnose slow responses.
log_format phoenix_timed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time urt=$upstream_response_time '
                        'uaddr=$upstream_addr ustatus=$upstream_status';

# caching
# http://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_cache_path
proxy_cache_path ${prefix}/var/cache/nginx levels=1:2 keys_zone=phoenix:2m inactive=10m max_size=100m;

server {
    listen ${http_port};
    server_name ${hostname};
    access_log ${prefix}/var/log/nginx/access.log phoenix_timed;

    # gzip
    # https://www.nginx.com/resources/admin-guide/compression-and-decompression/
    gzip on;
    gzip_comp_level 2;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_types text/plain text/html text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Disable for IE < 6 because there are some known problems
    gzip_disable "MSIE [1-6].(?!.*SV1)";


    # Add a vary header for downstream proxies to avoid sending cached gzipped files to IE6
    gzip_vary on;

    # Phoenix app
    location /
    {
        proxy_pass              http://phoenix;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $http_host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_redirect          off;
        proxy_connect_timeout   15s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
        client_max_body_size    ${client_max_body_size};
    }

    # https://nginx.org/en/docs/http/ngx_http_proxy_module.html
    location /download/outputs
    {
        proxy_pass              ${wps_url}/outputs;
        proxy_connect_timeout   15s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
        proxy_set_header        Host      $host;
        proxy_set_header        X-Real-IP $remote_addr;
    }

}
